<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAALCHKR - Opening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Cormorant Garamond', serif;
      background: #0a0806;
      color: #d4c9b5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #opening {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0a0806;
      overflow: hidden;
    }

    .opening-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      animation: bgZoomIn 20s ease-in-out infinite alternate;
      background: #1a1410;
    }
    .opening-bg-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes bgZoomIn {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .opening-overlay {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(180deg, 
          rgba(10, 8, 6, 0.2) 0%,
          rgba(10, 8, 6, 0.5) 40%,
          rgba(10, 8, 6, 0.8) 70%,
          rgba(10, 8, 6, 0.95) 100%
        );
      z-index: 1;
      pointer-events: none;
    }

    .opening-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .opening-particles {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(212, 175, 55, 0.15);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0px) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) translateX(50px) scale(1); opacity: 0; }
    }

    .opening-fog {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .fog-layer {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(180, 160, 130, 0.06), transparent 60%);
      animation: fogDrift 30s ease-in-out infinite alternate;
    }
    .fog-layer-2 {
      background: radial-gradient(ellipse at 70% 50%, rgba(200, 180, 150, 0.04), transparent 50%);
      animation-delay: -10s;
      animation-duration: 35s;
    }
    .fog-layer-3 {
      background: radial-gradient(ellipse at 50% 80%, rgba(160, 140, 120, 0.03), transparent 40%);
      animation-delay: -20s;
      animation-duration: 40s;
    }
    @keyframes fogDrift {
      0% { transform: translateX(-5%) scale(1); opacity: 0.5; }
      50% { opacity: 0.8; }
      100% { transform: translateX(5%) scale(1.1); opacity: 0.5; }
    }

    .opening-rays {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }
    .ray {
      position: absolute;
      top: -50%;
      width: 100px;
      height: 200%;
      background: linear-gradient(180deg, 
        rgba(212, 175, 55, 0.03) 0%,
        rgba(212, 175, 55, 0.05) 30%,
        rgba(212, 175, 55, 0.02) 60%,
        transparent 100%
      );
      transform: rotate(25deg);
      animation: rayMove 15s ease-in-out infinite;
      filter: blur(20px);
    }
    .ray:nth-child(1) { left: -10%; animation-delay: 0s; }
    .ray:nth-child(2) { left: 30%; animation-delay: -5s; width: 150px; }
    .ray:nth-child(3) { left: 70%; animation-delay: -10s; width: 120px; }
    @keyframes rayMove {
      0% { transform: rotate(25deg) translateX(-100px); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% { transform: rotate(25deg) translateX(200px); opacity: 0; }
    }

    .opening-flare {
      position: absolute;
      top: 20%;
      right: 15%;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.06), transparent 70%);
      z-index: 1;
      pointer-events: none;
      animation: flarePulse 8s ease-in-out infinite;
    }
    @keyframes flarePulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .opening-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 900px;
      padding: 2rem;
      animation: contentFadeIn 3s ease forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    @keyframes contentFadeIn {
      0% { opacity: 0; transform: scale(0.95) translateY(30px); }
      60% { opacity: 0.5; }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ============================================
       GOLDEN WHEEL LOGO (KAALCHKR)
       ============================================ */
    .wheel-logo {
      display: inline-block;
      width: 100px;
      height: 100px;
      margin: 0 auto 0.5rem;
      position: relative;
      animation: wheelSpin 20s linear infinite;
    }
    @keyframes wheelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .wheel-logo svg {
      width: 100%;
      height: 100%;
    }

    .wheel-logo .outer-ring {
      fill: none;
      stroke: #d4af37;
      stroke-width: 3;
      opacity: 0.8;
    }
    .wheel-logo .inner-ring {
      fill: none;
      stroke: #b89a6b;
      stroke-width: 2;
      opacity: 0.6;
    }
    .wheel-logo .spoke {
      fill: none;
      stroke: #d4af37;
      stroke-width: 2;
      opacity: 0.7;
    }
    .wheel-logo .center {
      fill: #d4af37;
      opacity: 0.9;
    }
    .wheel-logo .glow {
      fill: none;
      stroke: #d4af37;
      stroke-width: 1;
      opacity: 0.3;
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.2; stroke-width: 1; }
      50% { opacity: 0.5; stroke-width: 3; }
    }

    .opening-title {
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.08em;
      color: #e8dccc;
      text-shadow: 
        0 0 60px rgba(180, 140, 80, 0.2),
        0 0 120px rgba(180, 140, 80, 0.1),
        0 4px 30px rgba(0,0,0,0.9);
      margin-bottom: 0.5rem;
      animation: titleGlow 4s ease-in-out infinite alternate;
      text-align: center;
      width: 100%;
    }
    @keyframes titleGlow {
      0% { text-shadow: 0 0 60px rgba(180, 140, 80, 0.15), 0 4px 30px rgba(0,0,0,0.9); }
      100% { text-shadow: 0 0 80px rgba(212, 175, 55, 0.25), 0 0 150px rgba(212, 175, 55, 0.1), 0 4px 30px rgba(0,0,0,0.9); }
    }
    .opening-title .gold {
      color: #d4af37;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.2);
    }

    .opening-tagline {
      font-size: clamp(1rem, 3vw, 1.6rem);
      letter-spacing: 0.3rem;
      margin-top: 0.3rem;
      color: #b8a58a;
      font-weight: 400;
      text-transform: uppercase;
      opacity: 0.8;
      animation: taglineReveal 4s ease 1s forwards;
      opacity: 0;
      text-align: center;
      width: 100%;
    }
    @keyframes taglineReveal {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 0.8; transform: translateY(0); }
    }

    .opening-divider {
      width: 200px;
      height: 1px;
      margin: 1.5rem auto;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.3), transparent);
      animation: dividerGrow 2s ease 1.5s forwards;
      transform: scaleX(0);
    }
    @keyframes dividerGrow {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    .sound-indicator {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      background: rgba(20, 16, 12, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid #3d3228;
      color: #d4c9b5;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.1rem;
      cursor: pointer;
      transition: all 0.4s ease;
      opacity: 0.7;
    }
    .sound-indicator:hover {
      opacity: 1;
      border-color: #b89a6b;
      transform: scale(1.05);
    }
    .sound-indicator .icon {
      margin-right: 0.3rem;
    }

    .btn-start {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 1.4rem;
      padding: 1rem 4rem;
      background: transparent;
      border: 2px solid #b89a6b;
      color: #d4c9b5;
      letter-spacing: 0.3rem;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(184, 154, 107, 0.05);
      margin-top: 1.5rem;
      opacity: 0;
      animation: buttonAppear 2s ease 2.5s forwards;
    }
    @keyframes buttonAppear {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .btn-start::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, 
        transparent 30%, 
        rgba(212, 175, 55, 0.2) 50%, 
        transparent 70%
      );
      background-size: 200% 200%;
      animation: borderGlow 3s linear infinite;
      z-index: -1;
      border-radius: 2px;
    }
    @keyframes borderGlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .btn-start::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 40%,
        rgba(212, 175, 55, 0.03) 45%,
        rgba(212, 175, 55, 0.06) 50%,
        rgba(212, 175, 55, 0.03) 55%,
        transparent 60%
      );
      animation: shimmer 4s ease-in-out infinite;
      transform: rotate(25deg);
      pointer-events: none;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%) rotate(25deg); }
      100% { transform: translateX(100%) rotate(25deg); }
    }

    .btn-start:hover {
      background: rgba(184, 154, 107, 0.08);
      border-color: #d4af37;
      box-shadow: 
        0 0 40px rgba(212, 175, 55, 0.15),
        inset 0 0 40px rgba(212, 175, 55, 0.05);
      transform: scale(1.05) translateY(-3px);
      color: #f0e6d3;
    }
    .btn-start:active {
      transform: scale(0.95) translateY(0);
    }

    .btn-start .btn-text {
      position: relative;
      z-index: 2;
      display: inline-block;
      transition: all 0.5s ease;
      text-shadow: 0 0 20px rgba(184, 154, 107, 0.2);
    }
    .btn-start:hover .btn-text {
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
    }

    .btn-start .pulse-ring {
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(212, 175, 55, 0.1);
      border-radius: 2px;
      animation: pulseRing 2s ease-out infinite;
      pointer-events: none;
    }
    .btn-start .pulse-ring:nth-child(2) {
      animation-delay: 0.6s;
    }
    .btn-start .pulse-ring:nth-child(3) {
      animation-delay: 1.2s;
    }
    @keyframes pulseRing {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .loading-indicator {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      z-index: 100;
      color: #6a5d4e;
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1rem;
      opacity: 0.5;
      transition: opacity 0.5s ease;
    }

    .image-fallback {
      display: none;
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 30% 40%, rgba(60, 40, 30, 0.3), transparent 60%),
        radial-gradient(ellipse at 70% 60%, rgba(40, 30, 20, 0.2), transparent 50%),
        linear-gradient(180deg, #1a1410, #0a0806);
      z-index: 0;
    }
    .image-fallback.show {
      display: block;
    }

    @media (max-width: 768px) {
      .opening-title { font-size: 3.5rem; }
      .btn-start { font-size: 1.1rem; padding: 0.8rem 2.5rem; }
      .opening-divider { width: 120px; }
      .opening-flare { width: 150px; height: 150px; }
      .sound-indicator { bottom: 1rem; right: 1rem; padding: 0.4rem 0.8rem; font-size: 0.7rem; }
      .wheel-logo { width: 70px; height: 70px; }
    }
    @media (max-width: 480px) {
      .opening-title { font-size: 2.8rem; }
      .btn-start { font-size: 1rem; padding: 0.6rem 2rem; }
      .opening-tagline { font-size: 0.8rem; letter-spacing: 0.15rem; }
      .opening-divider { width: 80px; }
      .wheel-logo { width: 55px; height: 55px; }
    }
  </style>
</head>
<body>
  <div id="opening">
    <div class="opening-bg-image" id="bgContainer">
      <img src="opback.png" alt="Historical Landscape" id="bgImage">
    </div>
    <div class="image-fallback" id="imageFallback"></div>
    <div class="opening-overlay"></div>
    <div class="opening-vignette"></div>
    <div class="opening-particles" id="particles"></div>
    <div class="opening-fog">
      <div class="fog-layer"></div>
      <div class="fog-layer fog-layer-2"></div>
      <div class="fog-layer fog-layer-3"></div>
    </div>
    <div class="opening-rays">
      <div class="ray"></div>
      <div class="ray"></div>
      <div class="ray"></div>
    </div>
    <div class="opening-flare"></div>

    <button class="sound-indicator" id="soundToggle">
      <span class="icon">🔊</span> Sound ON
    </button>
    <div class="loading-indicator" id="loadingIndicator">● LOADING...</div>

    <div class="opening-content">
      <!-- Golden Wheel Logo -->
      <div class="wheel-logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer Ring -->
          <circle class="outer-ring" cx="50" cy="50" r="45"/>
          <!-- Inner Ring -->
          <circle class="inner-ring" cx="50" cy="50" r="35"/>
          <!-- Glow Ring -->
          <circle class="glow" cx="50" cy="50" r="42"/>
          <!-- Center -->
          <circle class="center" cx="50" cy="50" r="6"/>
          <!-- 8 Spokes -->
          <line class="spoke" x1="50" y1="5" x2="50" y2="25"/>
          <line class="spoke" x1="50" y1="75" x2="50" y2="95"/>
          <line class="spoke" x1="5" y1="50" x2="25" y2="50"/>
          <line class="spoke" x1="75" y1="50" x2="95" y2="50"/>
          <line class="spoke" x1="18" y1="18" x2="32" y2="32"/>
          <line class="spoke" x1="68" y1="68" x2="82" y2="82"/>
          <line class="spoke" x1="18" y1="82" x2="32" y2="68"/>
          <line class="spoke" x1="68" y1="32" x2="82" y2="18"/>
          <!-- Small dots on outer ring -->
          <circle cx="50" cy="8" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="50" cy="92" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="8" cy="50" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="92" cy="50" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="20" cy="20" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="80" cy="80" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="20" cy="80" r="2" fill="#d4af37" opacity="0.6"/>
          <circle cx="80" cy="20" r="2" fill="#d4af37" opacity="0.6"/>
        </svg>
      </div>

      <!-- Title - "KAALCHKR" (removed last 'a' from CHKRA) -->
      <h1 class="opening-title">
        <span class="gold">K</span>AALCHKR
      </h1>
      <p class="opening-tagline">Experience History. Change Your Journey. Not History.</p>
      <div class="opening-divider"></div>
      <button class="btn-start" id="btnStart">
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>
        <span class="pulse-ring"></span>
        <span class="btn-text">✦ Start Your Journey ✦</span>
      </button>
    </div>
  </div>

  <script>
    // ============================================
    // SOUND ENGINE
    // ============================================
    class SoundEngine {
      constructor() {
        this.context = null;
        this.isEnabled = true;
        this.initAudio();
      }

      initAudio() {
        try {
          this.context = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          this.isEnabled = false;
        }
      }

      resume() {
        if (this.context && this.context.state === 'suspended') {
          this.context.resume();
        }
      }

      playClick(volume = 0.2) {
        if (!this.isEnabled || !this.context) return;
        this.resume();
        try {
          const osc = this.context.createOscillator();
          const gain = this.context.createGain();
          osc.connect(gain);
          gain.connect(this.context.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.context.currentTime);
          osc.frequency.exponentialRampToValueAtTime(400, this.context.currentTime + 0.05);
          gain.gain.setValueAtTime(volume * 0.4, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.context.currentTime + 0.08);
          osc.start(this.context.currentTime);
          osc.stop(this.context.currentTime + 0.08);
        } catch (e) {}
      }

      playSword(volume = 0.25) {
        if (!this.isEnabled || !this.context) return;
        this.resume();
        try {
          const bufferSize = this.context.sampleRate * 0.08;
          const buffer = this.context.createBuffer(1, bufferSize, this.context.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const t = i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * Math.sin(t * 80) * Math.exp(-t * 5);
          }
          const noise = this.context.createBufferSource();
          const gain = this.context.createGain();
          const filter = this.context.createBiquadFilter();
          noise.buffer = buffer;
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.context.destination);
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2000, this.context.currentTime);
          filter.frequency.exponentialRampToValueAtTime(1000, this.context.currentTime + 0.06);
          filter.Q.value = 3;
          gain.gain.setValueAtTime(volume * 0.6, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.context.currentTime + 0.08);
          noise.start(this.context.currentTime);
          noise.stop(this.context.currentTime + 0.08);
        } catch (e) {}
      }

      toggle() {
        this.isEnabled = !this.isEnabled;
        return this.isEnabled;
      }
    }

    const sound = new SoundEngine();

    // ============================================
    // SOUND TOGGLE
    // ============================================
    const soundToggle = document.getElementById('soundToggle');
    soundToggle.addEventListener('click', () => {
      const enabled = sound.toggle();
      soundToggle.innerHTML = enabled 
        ? '<span class="icon">🔊</span> Sound ON'
        : '<span class="icon">🔇</span> Sound OFF';
      if (enabled) sound.playClick(0.15);
    });

    // ============================================
    // PARTICLES
    // ============================================
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 60;
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 4 + 1;
        const left = Math.random() * 100;
        const duration = Math.random() * 30 + 20;
        const delay = Math.random() * 20;
        const opacity = Math.random() * 0.3 + 0.1;
        particle.style.cssText = `
          left: ${left}%;
          width: ${size}px;
          height: ${size}px;
          animation-duration: ${duration}s;
          animation-delay: ${delay}s;
          opacity: ${opacity};
          background: ${Math.random() > 0.5 ? 'rgba(212, 175, 55, 0.15)' : 'rgba(200, 180, 150, 0.1)'};
        `;
        container.appendChild(particle);
      }
    }

    // ============================================
    // PARALLAX
    // ============================================
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth - 0.5;
      const y = e.clientY / window.innerHeight - 0.5;
      const bg = document.getElementById('bgContainer');
      if (bg) {
        bg.style.transform = `scale(1.05) translate(${x * -10}px, ${y * -8}px)`;
      }
      const fog = document.querySelectorAll('.fog-layer');
      fog.forEach((layer, index) => {
        const speed = 5 + index * 3;
        layer.style.transform = `translate(${x * speed}px, ${y * speed * 0.5}px)`;
      });
      const flare = document.querySelector('.opening-flare');
      if (flare) {
        flare.style.transform = `translate(${x * 30}px, ${y * 20}px)`;
      }
      const rays = document.querySelectorAll('.ray');
      rays.forEach((ray, index) => {
        const speed = 8 + index * 4;
        ray.style.transform = `rotate(${25 + x * 5}deg) translateX(${x * speed}px)`;
      });
    });

    // ============================================
    // BUTTON CLICK - GO TO DASHBOARD OR EMPIRES
    // ============================================
    const btnStart = document.getElementById('btnStart');
    const SESSION_KEY = 'legends_session';

    function getSession() {
      try {
        const data = localStorage.getItem(SESSION_KEY);
        return data ? JSON.parse(data) : null;
      } catch {
        return null;
      }
    }

    btnStart.addEventListener('click', function(e) {
      // Play sounds
      if (sound.isEnabled) {
        sound.playClick(0.2);
        setTimeout(() => sound.playSword(0.25), 100);
      }
      
      // Button animation
      this.style.transform = 'scale(0.92)';
      setTimeout(() => {
        this.style.transform = 'scale(1)';
      }, 200);
      
      // Ripple effect
      const ripple = document.createElement('span');
      ripple.style.cssText = `
        position: absolute;
        inset: 0;
        border: 2px solid rgba(212, 175, 55, 0.4);
        border-radius: 2px;
        animation: rippleOut 0.8s ease forwards;
        pointer-events: none;
      `;
      this.appendChild(ripple);
      
      const style = document.createElement('style');
      style.textContent = `
        @keyframes rippleOut {
          0% { transform: scale(1); opacity: 0.8; }
          100% { transform: scale(1.3); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
      
      // Check if user is already logged in
      const session = getSession();
      if (session && session.username) {
        // Already logged in - go directly to empires
        console.log('✅ User already logged in, redirecting to empires.html');
        setTimeout(() => {
          window.location.href = 'empires.html';
        }, 600);
      } else {
        // Not logged in - go to dashboard
        console.log('❌ User not logged in, redirecting to dashboard.html');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 600);
      }
    });

    // ============================================
    // ENABLE AUDIO ON FIRST INTERACTION
    // ============================================
    let audioEnabled = false;

    function enableAudio() {
      if (audioEnabled) return;
      audioEnabled = true;
      sound.resume();
      document.getElementById('loadingIndicator').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loadingIndicator').style.display = 'none';
      }, 500);
    }

    // ============================================
    // IMAGE LOAD CHECK
    // ============================================
    const bgImage = document.getElementById('bgImage');
    const fallback = document.getElementById('imageFallback');
    
    bgImage.onload = function() {
      console.log('✅ Background image loaded successfully!');
    };
    bgImage.onerror = function() {
      console.warn('⚠️ opback.png failed to load. Using fallback.');
      fallback.classList.add('show');
      bgImage.style.display = 'none';
    };

    // ============================================
    // INIT
    // ============================================
    createParticles();

    console.log('🎮 Welcome to KAALCHKR!');
    console.log('🔊 Click anywhere to enable audio');
    console.log('');
    console.log('📍 OPENING PAGE - Always shows first');
    console.log('   Click "Start Your Journey" to continue');
    console.log('');
    console.log('   If logged in → Redirect to empires.html');
    console.log('   If not logged in → Redirect to dashboard.html');
    console.log('');
    console.log('📁 Navigation Flow:');
    console.log('   opening.html → (click button) → dashboard.html or empires.html');
  </script>
</body>
</html>
